services:
  - type: web
    name: logistics-backend
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn server.wsgi:application"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: logistics-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "*" # You can restrict this later to your app's URL
      - key: FIREBASE_SERVICE_ACCOUNT_B64
        sync: false # Set this in the Render dashboard manually
      - key: FIREBASE_DATABASE_URL
        value: "https://your-project-id.firebaseio.com"
      - key: PYTHON_VERSION
        value: 3.12.10

databases:
  - name: logistics-db
    plan: free
    region: singapore # Change to your preferred region
